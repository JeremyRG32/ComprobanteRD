<h2 mat-dialog-title>Rechazar Comprobante</h2>

<mat-dialog-content>
  <p>
    Especifique el motivo por el cual este comprobante no puede ser validado. Este mensaje será
    enviado al cliente por WhatsApp.
  </p>

  <mat-form-field appearance="outline" class="reason-field">
    <mat-label>Motivo del rechazo</mat-label>
    <textarea
      matInput
      rows="4"
      [(ngModel)]="rejectVoucherDTO.reason"
      placeholder="Ej: El monto transferido no coincide con la orden."
      required
    ></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="reject" matButton="outlined" (click)="onCancel()">Cancelar</button>
  <button
    class="confirm"
    mat-flat-button
    [disabled]="!rejectVoucherDTO.reason.trim()"
    (click)="onConfirm()"
  >
    Confirmar Rechazo
  </button>
</mat-dialog-actions>
