<aside class="sidebar">
  <div class="brand">
    <div class="brandicon">C</div>
    <span>ComprobanteRD</span>
  </div>

  <nav class="nav">
    <a class="navitem" routerLink="/dashboard" routerLinkActive="active">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>

    <a class="navitem" routerLink="/transaction-history" routerLinkActive="active">
      <mat-icon>access_time</mat-icon>
      <span>Historial</span>
    </a>

    <a class="navitem" routerLink="/customers" routerLinkActive="active">
      <mat-icon>group</mat-icon>
      <span>Clientes</span>
    </a>

    <a class="navitem" routerLink="/settings" routerLinkActive="active">
      <mat-icon>settings</mat-icon>
      <span>Configuracion</span>
    </a>
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <div class="spacer"></div>

    <div class="userinfo">
      <div class="username">{{ userName }}</div>
      <div class="role">Auditor</div>
    </div>

    <a (click)="logout()">
      <mat-icon class="logout">logout</mat-icon>
    </a>
  </header>

  <div class="content"><router-outlet></router-outlet></div>
</div>
