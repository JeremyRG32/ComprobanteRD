<h2>Iniciar Sesion</h2>

<form (submit)="onSubmit()" [formGroup]="form">
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput [formControl]="form.controls.email" />
    <mat-error>{{ getEmailErrors() }}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput [formControl]="form.controls.password" />
    <mat-error>{{ getPasswordErrors() }}</mat-error>
  </mat-form-field>

  <div class="buttons-container">
    <button mat-flat-button type="submit" [disabled]="form.invalid">{{ 'Iniciar Sesion' }}</button>
  </div>
</form>
